<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

css
/* Estilo para a barra de progresso tipo cronômetro *//
.progress-container {
width: 100%;
height: 30px;
background-color: #f3f3f3; 
border-radius: 15px;
overflow: hidden; 
position: relative; 
}
/* Estilo para a parte visível da barra de progresso */
.progress-bar {
height: 100%;
background-color: #4caf50; 
width: 0;
transition: width 0.5s ease; 
}
/* Estilo para o texto do cronômetro */
.timer-text {
width: 100%;
text-align: center; 
line-height: 30px;
font-size: 16px; 
color: white; 
font-weight: bold;      
}
</style>


</head>
<body>
    <div class="progress-bar" style="width: 70%">
        <div class="timer-text">0</div>
    </div>

</body>
</html>
