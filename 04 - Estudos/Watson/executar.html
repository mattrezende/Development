<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Watson • Executando</title>
  <link rel="stylesheet" href="./css/pages.css" />
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/style.css" />  
</head>
<body>
<div class="app">
    <app-sidebar></app-sidebar>
    <script src="./components/sidebar.js"></script>
<main class="main-exe">
<div class="watch">
  <h1>Iniciar Estudo</h1>

  <select class="execute" id="materiaSelect"></select>

  <h2 id="timer">00:00</h2>

  <button onclick="iniciar()">Iniciar</button>
  <button onclick="pausar()">Pausar</button>
  <button onclick="finalizar()">Finalizar</button>
</div>


<!-- DASHBOARD -->

<section class="main-card">
<section id="dashboardArea">

    <div class="card">
        <h2>Cards de Hoje</h2>
        <div id="todayCounter"></div>
        <button onclick="startTodayStudy()">Estudar Agora</button>
    </div>

</section>


<!-- BIBLIOTECA -->
<section id="libraryArea" >

    <div class="card">
        <h2>Biblioteca</h2>
        <div id="library"></div>
    </div>

</section>
</section>
</main>

</div>
<script src="js/timer.js"></script>
<script src="./js/flashcards.js"></script>
</body>
</html>
