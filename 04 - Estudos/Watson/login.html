<!DOCTYPE html>
<html lang="pt-BR">
  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watson</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />

  <style>
*{
  margin:0;
  padding:0;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CARD */
.card{
width:auto;
margin-right: 50px;
border-radius:20px;
padding:40px;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
position:relative;
overflow:hidden;

}

/* FORM CONTAINER */
.forms{
  display:flex;
  width:250%;
  transition:0.6s ease;
}

.form{
  width:50%;
  padding:10px;
}

h2{
  margin-bottom:20px;
  text-align:center;
  color:#f7f7f7;
}

.input{
  margin-bottom:15px;
}

.input input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  outline:none;
}

/* SWITCH */
.switch{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

.switch span{
    color:#8b5cf6;
  cursor:pointer;
  font-weight:bold;
}

/* ACTIVE STATE */
.card.active .forms{
  transform:translateX(-50%);
}
</style>
  </head>

<body>
    <div class="card" id="card">

  <div class="forms">

    <!-- LOGIN -->
    <div class="form">
      <h2>Login</h2>

      <div class="input">
        <input type="email" placeholder="Email">
      </div>

      <div class="input">
        <input type="password" placeholder="Senha">
      </div>

      <button>Entrar</button>

      <div class="switch">
        Não tem conta? <span onclick="toggle()">Cadastrar</span>
      </div>
    </div>

    <!-- CADASTRO -->
    <div class="form">
      <h2>Cadastro</h2>

      <div class="input">
        <input type="text" placeholder="Nome">
      </div>

      <div class="input">
        <input type="email" placeholder="Email">
      </div>

      <div class="input">
        <input type="password" placeholder="Senha">
      </div>

      <button>Cadastrar</button>

      <div class="switch">
        Já tem conta? <span onclick="toggle()">Login</span>
      </div>
    </div>

  </div>
</div>

<script>
function toggle(){
  document.getElementById("card").classList.toggle("active");
}
</script>

</body>
</body>
</html>
