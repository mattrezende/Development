<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Watson • Estudar</title>
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/pages.css" /> 
  <link rel="stylesheet" href="./css/style.css" />
     
</head>

<body>
<div class="app">
    <app-sidebar></app-sidebar>
    <script src="./components/sidebar.js"></script>
<main class="main-exe">

    <h1 class="main-title">Vamos estudar</h1>
    <hr>

  <h1>Iniciar Estudo</h1>

<!-- DASHBOARD -->
<section class="main-card">
<div id="dashboardArea">

    <div class="card" id="current">
        <h1>Revisão do Ciclo</h1>
            <div id="selectCounter"></div>
        <button id="currentStudyBtn" onclick="startCurrentStudy()">Estudar Agora</button>
    </div>

    <div class="card" id="todaySM2">
        <h1>Revisão Geral</h1>
            <div id="todayCounter"></div>
        <button id="todayStudyBtn" onclick="startTodayStudy()">Estudar Agora</button>
    </div>


</div>


<!-- BIBLIOTECA -->
<div id="libraryArea" >

    <div class="card">
        <h2>Biblioteca</h2>
        <div id="library"></div>
    </div>

</div>

<div id="flashcardContainer" class="hidden">

    <div id="studyHeader">
    <h2 id="activeDiscipline"></h2>
    <p id="remainingCount"></p>

    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    </div>


    <div id="flashcard">
        <div class="card-inner">
        <div class="front"></div>
        <div class="back"></div>
        </div>
    </div>

   <div id="reviewButtons" class="hidden">
    <button onclick="reviewCard(0)">Errei</button>
    <button onclick="reviewCard(3)">Difícil</button>
    <button onclick="reviewCard(4)">Médio</button>
    <button onclick="reviewCard(5)">Fácil</button>
  </div>
</div>

</section>



    <!-- BOTÃO FLUTUANTE -->
<button id="openSidebar" class="fab">+</button>

<!-- OVERLAY -->
<div id="overlay"></div>

 <!-- SIDEBAR CADASTRO CARD -->
<aside id="newCard" class="sidebar card-sidebar">

    <h2 class="sidetitle">Novo Flashcard</h2>
    <hr>
    <br>

    <label>Disciplina</label>

   
 <!-- Select de disciplina e tema -->   
  
   <script src="./components/disciplina-tema-select.js"></script>

<disciplina-tema-select id="estudo"></disciplina-tema-select>


<script>
function ver() {
  const comp = document.getElementById("estudo");
  console.log(comp.value);
}
</script>

<!-- fim o select -->


    <label>Pergunta</label>
    <input id="question" placeholder="Pergunta">

    <label>Resposta</label>
    <textarea id="answer" placeholder="Resposta"></textarea>

    <button id="addBtn">Salvar Card</button>
    <hr>


</aside>
 <app-footer></app-footer>
 <script src="components/app-footer.js"></script>
</main>

<script src="./js/flashcards.js" defer></script>
<script src="js/timer.js"></script>
</div>
</body>
</html>
