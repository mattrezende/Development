<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Watson Flashcards</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:white;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    height:100vh;
    background:#020617;
    padding:20px;
    position:fixed;
}

.sidebar h1{
    margin-bottom:30px;
}

.sidebar button{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    background:#1e293b;
    color:white;
    cursor:pointer;
    border-radius:8px;
}

.sidebar button:hover{
    background:#334155;
}

/* MAIN */

.main{
    margin-left:270px;
    padding:30px;
}

/* FLIP CARD */

.flip-container{
    perspective:1000px;
    width:600px;
    height:350px;
    margin:auto;
}

.flip-card{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.6s;
}

.flip-card.flipped{
    transform:rotateY(180deg);
}

.card-face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    background:#020617;
    border-radius:15px;
    padding:30px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.card-back{
    transform:rotateY(180deg);
}

/* BUTTONS */

.review-buttons{
    margin-top:20px;
}

.review-buttons button{
    margin:5px;
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.again{background:#dc2626;}
.hard{background:#f59e0b;}
.good{background:#16a34a;}
.easy{background:#2563eb;}

input, textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    border:none;
}

button.primary{
    background:#2563eb;
    color:white;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.stats{
    display:flex;
    gap:20px;
}

.stat{
    background:#020617;
    padding:20px;
    border-radius:12px;
    width:150px;
    text-align:center;
}

</style>
</head>

<body>

<div class="sidebar">
    <h1>🧠 Watson</h1>

    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('add')">Adicionar Card</button>
    <button onclick="startReview()">Revisar Hoje</button>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
    <h2>Dashboard</h2>

    <div class="stats">
        <div class="stat">
            <h3 id="totalCards">0</h3>
            <p>Cards</p>
        </div>

        <div class="stat">
            <h3 id="dueCards">0</h3>
            <p>Hoje</p>
        </div>

        <div class="stat">
            <h3 id="accuracy">0%</h3>
            <p>Acerto</p>
        </div>
    </div>
</div>

<!-- ADD -->
<div id="add" style="display:none">

    <h2>Novo Card</h2>

    <input id="subject" placeholder="Disciplina">
    <textarea id="question" placeholder="Pergunta"></textarea>
    <textarea id="answer" placeholder="Resposta"></textarea>

    <button class="primary" onclick="addCard()">Salvar</button>

</div>

<!-- REVIEW -->
<div id="review" style="display:none">

    <div class="flip-container">

        <div class="flip-card" id="flipCard" onclick="flipCard()">

            <!-- FRONT -->
            <div class="card-face">
                <h3 id="cardSubject"></h3>
                <p id="cardQuestion"></p>
                <small>(Clique para ver resposta)</small>
            </div>

            <!-- BACK -->
            <div class="card-face card-back">
                <h3>Resposta</h3>
                <p id="cardAnswer"></p>

                <div class="review-buttons">
                    <button class="again" onclick="rateCard(event,1)">Errei</button>
                    <button class="hard" onclick="rateCard(event,2)">Difícil</button>
                    <button class="good" onclick="rateCard(event,3)">Médio</button>
                    <button class="easy" onclick="rateCard(event,4)">Fácil</button>
                </div>

            </div>

        </div>

    </div>

</div>

</div>

<script>

let cards = JSON.parse(localStorage.getItem("cards") || "[]");
let reviewQueue = [];
let currentIndex = 0;

function save(){
    localStorage.setItem("cards", JSON.stringify(cards));
    updateStats();
}

function showSection(id){
    dashboard.style.display="none";
    add.style.display="none";
    review.style.display="none";

    document.getElementById(id).style.display="block";
}

function addCard(){

    let card = {
        subject: subject.value,
        question: question.value,
        answer: answer.value,
        interval:1,
        nextReview:Date.now(),
        reviews:0,
        success:0
    };

    cards.push(card);

    subject.value="";
    question.value="";
    answer.value="";

    save();
    alert("Card salvo!");
}

function startReview(){

    reviewQueue = cards.filter(c => c.nextReview <= Date.now());

    if(reviewQueue.length===0){
        alert("Nada para revisar 🎉");
        return;
    }

    currentIndex = 0;
    showSection("review");
    loadCard();
}

function loadCard(){

    let card = reviewQueue[currentIndex];

    cardSubject.innerText = card.subject;
    cardQuestion.innerText = card.question;
    cardAnswer.innerText = card.answer;

    flipCard(false);
}

function flipCard(force){

    let card = document.getElementById("flipCard");

    if(force===false){
        card.classList.remove("flipped");
        return;
    }

    card.classList.toggle("flipped");
}

function rateCard(event, score){

    event.stopPropagation();

    let card = reviewQueue[currentIndex];

    card.reviews++;

    if(score===1) card.interval = 1;
    if(score===2) card.interval *= 1.5;
    if(score===3){ card.interval *= 2; card.success++; }
    if(score===4){ card.interval *= 3; card.success++; }

    card.nextReview = Date.now() + card.interval * 86400000;

    currentIndex++;

    if(currentIndex >= reviewQueue.length){
        save();
        alert("Revisão concluída 🚀");
        showSection("dashboard");
        return;
    }

    loadCard();
    save();
}

function updateStats(){

    totalCards.innerText = cards.length;

    let due = cards.filter(c => c.nextReview <= Date.now()).length;
    dueCards.innerText = due;

    let totalReviews = cards.reduce((a,c)=>a+c.reviews,0);
    let totalSuccess = cards.reduce((a,c)=>a+c.success,0);

    let acc = totalReviews ? Math.round((totalSuccess/totalReviews)*100) : 0;
    accuracy.innerText = acc+"%";
}

updateStats();

</script>

</body>
</html>
