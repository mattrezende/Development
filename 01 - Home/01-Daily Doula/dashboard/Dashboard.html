<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Gestacional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>

  
</head>

<body>

<!-- ================= DASHBOARD ================= -->
<section>
  <h2>Dashboard – Ficha Gestacional</h2>

  <label>Selecione um registro:</label>
  <select id="registroSelect">
    <option value="">-- Selecione --</option>
  </select>

  <div id="card" class="card">

    <!-- CAMPOS -->
    <div class="row">
      <div class="field">
        <span class="label">Mamãe:</span>
        <span id="outNomeMae"></span>
        <input id="inNomeMae" style="display:none;">
      </div>
      <div class="field">
        <span class="label">Papai:</span>
        <span id="outNomePai"></span>
        <input id="inNomePai" style="display:none;">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <span class="label">Idade Mamãe:</span>
        <span id="outIdadeMae"></span>
        <input id="inIdadeMae" type="number" style="display:none;">
      </div>
      <div class="field">
        <span class="label">Idade Gestacional:</span>
        <span id="outIdadeGestacional"></span>
        <input id="inIdadeGestacional" type="number" style="display:none;">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <span class="label">DPP:</span>
        <span id="outDpp"></span>
        <input id="inDpp" type="date" style="display:none;">
      </div>
      <div class="field">
        <span class="label">Hospital:</span>
        <span id="outHospital"></span>
        <input id="inHospital" style="display:none;">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <span class="label">Endereço:</span>
        <span id="outEndereco"></span>
        <input id="inEndereco" style="display:none;">
      </div>
      <div class="field">
        <span class="label">Parto:</span>
        <span id="outParto"></span>
        <input id="inParto" style="display:none;">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <span class="label">Histórico:</span>
        <span id="outHistorico"></span>
        <textarea id="inHistorico" style="display:none;"></textarea>
      </div>
      <div class="field">
        <span class="label">Outros filhos:</span>
        <span id="outOutrosFilhos"></span>
        <textarea id="inOutrosFilhos" style="display:none;"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <span class="label">Nome do bebê:</span>
        <span id="outNomeBebe"></span>
        <input id="inNomeBebe" style="display:none;">
      </div>
    </div>

    <!-- BOTÕES -->
    <div style="text-align:right;">
      <button id="btnEditar" type="button">Editar</button>
      <button id="btnSalvar" type="button" style="display:none;">Salvar alterações</button>
    </div>
  </div>
</section>

<!-- ================= FORMULÁRIO ================= -->
<section>
  <h2>Nova Ficha Gestacional</h2>

  <form id="formGestacional">

    <label>Nome da mamãe:</label>
    <input id="nomeMae" required>

    <label>Nome do papai:</label>
    <input id="nomePai">

    <label>Idade da mamãe:</label>
    <input id="idadeMae" type="number">

    <label>Idade gestacional:</label>
    <input id="idadeGestacional" type="number">

    <label>DPP:</label>
    <input id="dpp" type="date">

    <label>Hospital:</label>
    <input id="hospital">

    <label>Endereço:</label>
    <input id="endereco">

    <label>Parto:</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="parto" value="Normal"> Normal</label>
      <label><input type="checkbox" name="parto" value="Cesárea"> Cesárea</label>
    </div>

    <label>Histórico:</label>
    <textarea id="historico"></textarea>

    <label>Outros filhos:</label>
    <textarea id="outrosFilhos"></textarea>

    <label>Nome do bebê:</label>
    <input id="nomeBebe">

    <button type="submit">Salvar ficha</button>
  </form>
</section>


</body>
</html>
